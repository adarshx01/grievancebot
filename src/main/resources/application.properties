gemini.api.key=AIzaSyD49w3ZDn0sQQ2GYZk8LZRjS8BlXqLCYHQ

# PostgreSQL Configuration - Dedicated Database
spring.datasource.url=jdbc:postgresql://ep-bold-flower-adwcegeh-pooler.c-2.us-east-1.aws.neon.tech/neondb?user=neondb_owner&password=npg_zxsChNgu9f0v&sslmode=require&channelBinding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_zxsChNgu9f0v
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.max-age=1800
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# Allow circular references temporarily
spring.main.allow-circular-references=true

# Logging
logging.level.com.redressalbot=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Error handling
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never

# CORS settings (if not already set)
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
